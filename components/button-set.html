<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Tombol CSS</title>
  <style>
    /* Selector tag */
    body {
      margin: 0;
      padding: 40px;
      background-color: #f5f6fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Selector descendant: body > main > h2 */
    body main h2 {
      margin: 0 0 12px 0;
      font-size: 20px;
      color: #1e2a47;
    }

    /* Selector class */
    .button-group {
      display: flex;
      gap: 12px;
      margin-bottom: 36px;
    }

    /* Selector class (dasar semua tombol) */
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: 2px solid transparent;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    .button-group.btn {
      margin-right: 10px;
      margin-bottom: 10px;
    }

    .btn-primary {
      background-color: #1e3a66;
      color: white;
      border-color: black;
    }

    .btn-secondary {
      background-color: rgb(221, 228, 240);
      color: #1e3a66;
      border-color: black;
    }

    .btn-outline {
      background-color: rgba(255, 255, 255, 1);
      color: #1e2a47;
      border-color: black;
    }

    .btn-send {
      background-color: #e8953f;
      color: #ffffff;
      border-color: black;
    }

    /* Selector pseudo-class :hover */
    .btn-primary:hover {
      background-color: #14264a;
    }

    .btn-secondary:hover {
      background-color: #bfcce3;
    }

    .btn-outline:hover {
      background-color: #e6ebf5;
    }

    .btn-send:hover {
      background-color: #c97f33;
    }

    /* Selector descendant: footer a */
    footer a {
      font-size: 11px;
      color: #5b2a86;
      text-decoration: underline;
    }

    /* Selector grouping */
    footer a:hover,
    footer a:focus {
      color: #3b1a5a;
    }
  </style>
</head>
<body>
  <main>
    <h2>Button</h2>
    <div class="button-group">
      <a href="/components/card-badge.html" class="btn btn-primary">Lihat Proyek</a>
      <a href="/components/card.html" class="btn btn-secondary">Kartu</a>
      <a href="/pages/contact.html" class="btn btn-outline">Hubungi Saya</a>
      <a href="/pages/about.html" class="btn btn-send">Tentang saya</a>
    </div>
  </main>

  <footer>
    <a href="/index.html">Kembali ke Beranda</a>
  </footer>
</body>
</html>
