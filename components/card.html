<!-- PERHITUNGAN LEBAR KARTU (jika box-sizing TIDAK diatur):
  width   = 320px
  padding = 20px kiri + 20px kanan = 40px
  border  = 2px kiri + 2px kanan   = 4px
  Total lebar tampil = 320 + 40 + 4 = 364px
 
  Dengan box-sizing: border-box, padding dan border ikut
  dihitung ke dalam width, sehingga lebar kartu tetap 320px. -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Proyek</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #eef7f1;
      font-family: "Poppins", Arial, sans-serif;
    }

 
    .card {
      width: 320px;
      padding: 20px;
      border: 2px solid #2f6f4f;
      border-radius: 10px;
      margin: 30px auto;
      background-color: #ffffff;
    }


    .card img {
      width: 100%;
      height: 160px;
      display: block;
    }


    .card h3 {
      color: #1b3a2b;
      margin-bottom: 6px;
    }


    .card p {
      font-size: 15px;
      color: #444444;
    }

    .card a {
      font-size: 15px;
      color: #d9480f;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding-bottom: 30px;
    }

    footer a {
      color: #1d4ed8;
    }
  </style>


</head>
<body>
  <main>
    <div class="card">
      <img
        src="/assets/images/games2.jpg"
        alt="Ilustrasi pegunungan">
      <h3>Galeri Fotografi Alam</h3>
      <p>Proyek latihan membuat galeri foto permainan games. Dibuat memakai HTML dan CSS internal.</p>
      <a href="#">Lihat Proyek</a>
    </div>
  </main>

  <footer>
    <a href="index.html">Kembali ke Beranda</a>
  </footer>
</body>
</html>
