<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Kontak</title>

  <style>
    /* Kotak */
    * {
      box-sizing: border-box;
    }

    /* body */
    body {
      margin: 0;
      background-color: #f4f6fb;
      font-family: "Poppins", Arial, sans-serif;
      color: #333333;
    }

    /* ID Contact */
    #contact {
      padding: 40px 20px;
    }

    /* contact-form */
    .contact-form {
      width: 400px;
      max-width: 100%;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid #9aa5c4;
      border-radius: 10px;
      background-color: #ffffff;
    }

    /* contact-form h2 */
    .contact-form h2 {
      text-align: center;
      color: #1f2f5c;
      margin-top: 0;
    }

    /* form-group */
    .form-group {
      margin-bottom: 16px;
    }

    /* form-group label */
    .form-group label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    /*  Grouping  */
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #c4c9d8;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      background-color: #e3eafc;
      border-color: #1f2f5c;
      outline: none;
    }

    /* Challenge*/
    .form-group textarea:focus {
      background-color: #fff7e0;
      border-color: #e8890c;
    }

    /* Tombol Submit */
    .btn-submit {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background-color: #1f2f5c;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #e8890c;
    }

    footer {
      text-align: center;
      padding-bottom: 40px;
    }

    footer a {
      color: #5b3fa0;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <section id="contact">
    <form class="contact-form" action="#" method="post">
      <h2>Hubungi Saya</h2>

      <div class="form-group">
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </div>

      <div class="form-group">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" rows="5"></textarea>
      </div>

      <button type="submit" class="btn-submit">Kirim Pesan</button>
    </form>
  </section>

  <footer>
    <a href="index.html">Kembali ke Beranda</a>
  </footer>
</body>
</html>
